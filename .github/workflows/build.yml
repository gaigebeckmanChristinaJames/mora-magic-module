name: Build Mora Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-cmdline-tools
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> $GITHUB_ENV
          echo "/usr/lib/android-sdk/cmdline-tools/bin" >> $GITHUB_PATH

      - name: Accept licenses and install packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Xposed API
        run: |
          mkdir -p xposed
          wget -q -O xposed/api-82.jar "https://repo1.maven.org/maven2/de/robv/android/xposed/api/82/api-82.jar"

      - name: Compile Java sources
        run: |
          mkdir -p obj
          javac -source 8 -target 8 \
            -bootclasspath $ANDROID_HOME/platforms/android-35/android.jar \
            -cp xposed/api-82.jar \
            -d obj \
            $(find app/src/main/java -name "*.java")

      - name: Convert to DEX
        run: |
          mkdir -p build
          $ANDROID_HOME/build-tools/35.0.0/d8 \
            --release \
            --min-api 26 \
            --lib $ANDROID_HOME/platforms/android-35/android.jar \
            --output build \
            $(find obj -name "*.class")

      - name: Build APK
        run: |
          mkdir -p build

          # Link resources (empty for now)
          $ANDROID_HOME/build-tools/35.0.0/aapt2 link \
            -o build/unsigned.apk \
            -I $ANDROID_HOME/platforms/android-35/android.jar \
            --manifest app/src/main/AndroidManifest.xml \
            --min-sdk-version 26 \
            --target-sdk-version 35 \
            --version-code 79 \
            --version-name "7.9.0"

          # Add classes.dex
          cd build
          zip -q unsigned.apk classes.dex
          cd ..

          # Add xposed_init
          cd app/src/main
          zip -q ../../../build/unsigned.apk assets/xposed_init
          cd ../../..

          # Zipalign
          $ANDROID_HOME/build-tools/35.0.0/zipalign -f 4 build/unsigned.apk build/aligned.apk

          # Generate keystore
          keytool -genkey -v -keystore build/mora.jks \
            -alias mora -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Mora, OU=Dev, O=Mora, L=Beijing, ST=Beijing, C=CN"

          # Sign
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks build/mora.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build/魔姬增强模块_v7.9.apk \
            build/aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 魔姬增强模块_v7.9
          path: build/魔姬增强模块_v7.9.apk
