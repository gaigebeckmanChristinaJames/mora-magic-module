name: Build Mora Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Compile Xposed stub
        run: |
          mkdir -p build/stub_classes
          javac -source 8 -target 8 -cp $ANDROID_HOME/platforms/android-34/android.jar \
            -d build/stub_classes \
            stub/de/robv/android/xposed/*.java stub/de/robv/android/xposed/callbacks/*.java

      - name: Compile resources
        run: |
          mkdir -p build/res_compiled
          $ANDROID_HOME/build-tools/34.0.0/aapt2 compile app/src/main/res/values/arrays.xml -o build/res_compiled/

      - name: Compile FileUploadHelper to classes2.dex
        run: |
          mkdir -p build/obj2 build/dex_out
          echo "=== Compiling FileUploadHelper ==="
          
          javac -source 8 -target 8 \
            -cp build/stub_classes:$ANDROID_HOME/platforms/android-34/android.jar \
            -d build/obj2 \
            app/src/main/java/com/mora/magicmodule/FileUploadHelper.java
          
          echo "=== javac exit code: $? ==="
          
          if [ -f build/obj2/com/mora/magicmodule/FileUploadHelper.class ]; then
            echo "=== Running d8 ==="
            $ANDROID_HOME/build-tools/34.0.0/d8 \
              --release \
              --min-api 26 \
              --lib $ANDROID_HOME/platforms/android-34/android.jar \
              --output build/dex_out \
              $(find build/obj2 -name "*.class")
            
            cp build/dex_out/classes.dex build/classes2.dex
            echo "Created classes2.dex: $(wc -c < build/classes2.dex) bytes"
          else
            echo "ERROR: FileUploadHelper.class not found"
          fi

      - name: Build APK
        run: |
          # Link with resources
          $ANDROID_HOME/build-tools/34.0.0/aapt2 link \
            -o build/unsigned.apk \
            -I $ANDROID_HOME/platforms/android-34/android.jar \
            --manifest app/src/main/AndroidManifest.xml \
            -R build/res_compiled/*.flat \
            --auto-add-overlay \
            --min-sdk-version 26 \
            --target-sdk-version 34 \
            --version-code 130 \
            --version-name "12.4.1"

          # Add dex files
          cd build
          # 原来的预编译 classes.dex
          cp ../app/src/main/dex/classes.dex .
          zip -q -j unsigned.apk classes.dex
          echo "Added classes.dex: $(wc -c < classes.dex) bytes"
          # 新的 classes2.dex（FileUploadHelper）
          if [ -f classes2.dex ]; then
            zip -q -j unsigned.apk classes2.dex
            echo "Added classes2.dex: $(wc -c < classes2.dex) bytes"
          fi

          # Add assets
          mkdir -p assets
          cp ../app/src/main/assets/xposed_init assets/xposed_init
          zip -q -r unsigned.apk assets/
          cd ..

          # Zipalign
          $ANDROID_HOME/build-tools/34.0.0/zipalign -f 4 build/unsigned.apk build/aligned.apk

          # Generate keystore
          keytool -genkey -v -keystore build/mora.jks \
            -alias mora -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Mora, OU=Dev, O=Mora, L=Beijing, ST=Beijing, C=CN"

          # Sign
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks build/mora.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build/mora-magic-v12.4.1.apk \
            build/aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mora-magic-v12.4.1
          path: build/mora-magic-v12.4.1.apk
